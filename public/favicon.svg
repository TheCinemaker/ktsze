<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    A böngészőfül ikonja. Ugyanaz a rajz, mint az alkalmazás emblémája, de
    beégetett színekkel: a favicon nem fér hozzá az oldal CSS-változóihoz.
    Sötét alap + arany rajz — kicsiben ez marad a legolvashatóbb, és a
    böngésző világos és sötét fülsávján egyaránt megáll.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0CE8A"/>
      <stop offset="45%" stop-color="#D8A94E"/>
      <stop offset="100%" stop-color="#A6762C"/>
    </linearGradient>
    <linearGradient id="field" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#2A1119"/>
      <stop offset="100%" stop-color="#140A0F"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#field)"/>
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D8A94E" stroke-opacity="0.28" stroke-width="0.8"/>

  <g stroke="url(#ring)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M30 68V48l6-4v24M36 44h6v24M42 44v-6l4-4 4 4v6M50 44h12v24M62 44V34l4-4 4 4v34"/>
  </g>
  <path d="M46 34V22l4 4v8z" fill="#E8BE6B"/>
  <path d="M16 70c14-6 27-6 34 0 7-6 20-6 34 0" stroke="#B8455C" stroke-width="2.8" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
